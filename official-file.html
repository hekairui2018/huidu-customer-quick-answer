<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灰度官方文件</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; height: 100vh; display: flex; flex-direction: column; }
  .topbar { background: #fff; padding: 10px 16px; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .topbar .title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
  .topbar .actions { display: flex; gap: 8px; }
  .topbar .btn { padding: 5px 14px; border-radius: 4px; font-size: 13px; text-decoration: none; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; color: #333; }
  .topbar .btn.primary { background: #1677ff; color: #fff; border-color: #1677ff; }
  .status-bar { background: #fffbe6; border-bottom: 1px solid #ffe58f; padding: 6px 16px; font-size: 12px; color: #ad6800; text-align: center; flex-shrink: 0; }
  .frame-wrap { flex: 1; position: relative; background: #fff; }
  .frame-wrap iframe { width: 100%; height: 100%; border: none; }
  .frame-wrap .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.9); z-index: 2; }
  .frame-wrap .overlay .spinner { width: 32px; height: 32px; border: 3px solid #e8e8e8; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .frame-wrap .overlay .msg { font-size: 14px; color: #666; }
</style>
</head>
<body>
<div class="topbar">
  <span class="title" id="docTitle">灰度官方文件</span>
  <div class="actions">
    <a class="btn primary" id="btnOpen" href="#" target="_blank" rel="noreferrer">在新窗口打开</a>
    <a class="btn" id="btnProduct" href="#" target="_blank" rel="noreferrer">官网产品页</a>
  </div>
</div>
<div class="status-bar" id="statusBar">正在加载灰度官网…</div>
<div class="frame-wrap" id="frameWrap">
  <div class="overlay" id="overlay">
    <div class="spinner"></div>
    <span class="msg">正在从灰度官网获取文件…</span>
  </div>
  <iframe id="bridge" referrerpolicy="unsafe-url" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
</div>

<script>
(function() {
  var params = new URLSearchParams(location.search);
  var url = params.get('url') || '';
  var name = params.get('name') || 'document.pdf';
  var decodedName = decodeURIComponent(name).replace(/\.pdf$/i, '');

  // Look up product page from official-links for the fallback
  var productPage = 'https://www.huidu.cn/';

  document.getElementById('docTitle').textContent = decodedName;
  document.getElementById('btnOpen').href = url;
  document.getElementById('btnOpen').download = name;
  document.getElementById('btnProduct').href = productPage;

  var bridge = document.getElementById('bridge');
  var statusBar = document.getElementById('statusBar');
  var overlay = document.getElementById('overlay');
  var frameWrap = document.getElementById('frameWrap');
  var redirected = false;

  function updateStatus(text) {
    statusBar.textContent = text;
  }

  function hideOverlay() {
    overlay.style.display = 'none';
  }

  // Step 1: load huidu.cn in the iframe
  bridge.src = 'https://www.huidu.cn/';

  bridge.onload = function() {
    if (redirected) return;

    hideOverlay();

    if (bridge.src.indexOf('huidu.cn') !== -1) {
      // huidu.cn loaded successfully — now navigate to the PDF
      updateStatus('正在打开文件…若长时间无反应请点击上方按钮');

      // Small delay to let the document settle
      setTimeout(function() {
        redirected = true;
        bridge.src = url;
      }, 800);
    } else if (bridge.src === url) {
      // Already on PDF — check if it loaded
      updateStatus('文件已打开');
      hideOverlay();
    }
  };

  // Handle errors
  bridge.onerror = function() {
    hideOverlay();
    updateStatus('文件加载失败，请点击上方按钮在新窗口中打开');
  };

  // Fallback: if nothing happens after 8 seconds, show manual buttons
  setTimeout(function() {
    hideOverlay();
    updateStatus('自动跳转可能被拦截，请点击上方按钮打开文件');
  }, 8000);
})();
</script>
</body>
</html>
